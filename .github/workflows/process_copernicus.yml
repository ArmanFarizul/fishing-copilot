name: Process Copernicus satellite data

on:
  schedule:
    # Daily at 02:00 UTC (10:00 in Malaysia), after the overnight Copernicus NRT updates.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write # upload the JSON to the latest-data release

concurrency:
  group: copernicus
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Until the repository secrets are added, skip with a warning instead of failing every day.
      - name: Check Copernicus credentials
        id: creds
        env:
          USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COPERNICUSMARINE_SERVICE_USERNAME / _PASSWORD secrets are not set; skipping."
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Test
        run: python -m pytest pipeline/tests -q

      - name: Download and compress satellite data
        if: steps.creds.outputs.ok == 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python -m pipeline.process_satellite --out daily_marine_fronts.json

      - name: Publish to the latest-data release
        if: steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-data >/dev/null 2>&1 || \
            gh release create latest-data --title "Latest marine data" --latest=false \
              --notes "Daily Copernicus Marine chlorophyll-a, SST and water clarity for Malaysian waters. Updated by the Process Copernicus satellite data workflow."
          gh release upload latest-data daily_marine_fronts.json --clobber
